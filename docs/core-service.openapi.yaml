openapi: 3.1.0
info:
  title: Core Service API
  version: 0.2.0
  description: |
    MVP-ready contract for the Go Core Service.

    This contract is intentionally designed for a first working implementation:
    - chat persistence and message queueing
    - business creation and membership management
    - session validation via JWT or session cookie
    - PostgreSQL as the source of truth
    - NATS for async AI processing

servers:
  - url: https://localhost
    description: Public API via NGINX
security:
  - bearerAuth: []

paths:
  /chat:
    post:
      summary: Create a new chat
      tags: [Chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateRequest'
      responses:
        '201':
          description: Chat created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get a chat and its messages with pagination
      tags: [Chat]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: chat_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: chat_name
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            description: Opaque pagination cursor
      responses:
        '200':
          description: Chat loaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Rename an existing chat
      tags: [Chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRenameRequest'
      responses:
        '200':
          description: Chat renamed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a chat
      tags: [Chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatDeleteRequest'
      responses:
        '200':
          description: Chat deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/message:
    post:
      summary: Save a message and queue it for AI processing
      tags: [Chat]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '202':
          description: Message accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /business:
    post:
      summary: Create a business record
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
      responses:
        '201':
          description: Business created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /business/member:
    post:
      summary: Add a member to a business
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessMemberRequest'
      responses:
        '201':
          description: Business member added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Remove a member from a business
      tags: [Business]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessMemberDeleteRequest'
      responses:
        '200':
          description: Business member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Validation or payload error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid auth/session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Entity was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Unexpected internal failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: chat_id is required when chat_name is missing
            details:
              type: object
              additionalProperties: true

    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: chat renamed successfully
        data:
          type: object
          additionalProperties: true

    ChatCreateRequest:
      type: object
      required: [user_id, chat_name]
      properties:
        user_id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        chat_name:
          type: string
          minLength: 1
          maxLength: 80
          example: sales-ops
        description:
          type: string
          maxLength: 500
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    ChatCreateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ChatRecord'

    ChatRenameRequest:
      type: object
      required: [user_id, chat_id, new_chat_name]
      properties:
        user_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        new_chat_name:
          type: string
          minLength: 1
          maxLength: 80

    ChatDeleteRequest:
      type: object
      required: [user_id, chat_id]
      properties:
        user_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid

    ChatDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [chat, messages]
          properties:
            chat:
              $ref: '#/components/schemas/ChatRecord'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessageRecord'
            next_cursor:
              type: string
              nullable: true

    ChatMessageRequest:
      type: object
      required: [user_id, chat_id, message_content]
      properties:
        user_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        message_content:
          type: string
          minLength: 1
          maxLength: 20000
          example: We lost 8% of customers this quarter. What should we do?
        metadata:
          type: object
          additionalProperties: true

    ChatMessageAcceptedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [message_id, chat_id, status, accepted_at]
          properties:
            message_id:
              type: string
              format: uuid
            chat_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [queued, processing, completed]
            accepted_at:
              type: string
              format: date-time

    BusinessCreateRequest:
      type: object
      required: [user_id, business_name]
      properties:
        user_id:
          type: string
          format: uuid
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          nullable: true
        business_data:
          type: object
          additionalProperties: true

    BusinessCreateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BusinessRecord'

    BusinessMemberRequest:
      type: object
      required: [user_id, business_id, member_user_id]
      properties:
        user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        member_user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, admin]
          default: member

    BusinessMemberDeleteRequest:
      type: object
      required: [user_id, business_id, member_user_id]
      properties:
        user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        member_user_id:
          type: string
          format: uuid

    ChatRecord:
      type: object
      required: [chat_id, user_id, chat_name, created_at, updated_at]
      properties:
        chat_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        chat_name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatMessageRecord:
      type: object
      required: [message_id, chat_id, user_id, role, content, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    BusinessRecord:
      type: object
      required: [business_id, user_id, business_name, created_at, updated_at]
      properties:
        business_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        business_name:
          type: string
        description:
          type: string
          nullable: true
        business_data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

        "500":
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BaseSessionRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          description: Authenticated user ID.
        session_id:
          type: string
          description: Optional explicit session identifier used for validation.
        chat_name:
          type: string
          description: Business or conversation alias used to identify the target chat.

    ChatCreateRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - chat_name
      properties:
        chat_name:
          type: string
          minLength: 1
          maxLength: 255
        metadata:
          type: object
          additionalProperties: true
          description: Optional extra metadata for the chat.

    ChatDeleteRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - chat_name
      properties:
        chat_name:
          type: string

    ChatRenameRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - chat_name
        - new_chat_name
      properties:
        chat_name:
          type: string
        new_chat_name:
          type: string
          minLength: 1
          maxLength: 255

    ChatMessageRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - chat_name
        - message_content
      properties:
        chat_name:
          type: string
        message_content:
          type: string
          minLength: 1
        message_type:
          type: string
          description: Optional enum-like field, e.g. user, assistant, system.
          default: user
        metadata:
          type: object
          additionalProperties: true

    BusinessCreateRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - business_name
        - business_data
      properties:
        business_name:
          type: string
          minLength: 1
          maxLength: 255
        business_data:
          type: object
          additionalProperties: true
        description:
          type: string
          nullable: true

    BusinessMemberRequest:
      allOf:
        - $ref: '#/components/schemas/BaseSessionRequest'
      type: object
      required:
        - user_id
        - business_id
        - member_user_id
      properties:
        business_id:
          type: integer
        member_user_id:
          type: integer
        role:
          type: string
          enum: [owner, admin, member]
          default: member

    ChatMessage:
      type: object
      required:
        - id
        - chat_id
        - role
        - content
        - created_at
      properties:
        id:
          type: integer
        chat_id:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Chat:
      type: object
      required:
        - id
        - user_id
        - name
        - created_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChatDetailResponse:
      type: object
      required:
        - chat
        - messages
        - total
      properties:
        chat:
          $ref: '#/components/schemas/Chat'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        total:
          type: integer
          minimum: 0

    ChatCreateResponse:
      type: object
      required:
        - chat_id
        - message
      properties:
        chat_id:
          type: integer
        message:
          type: string

    ChatMessageAcceptedResponse:
      type: object
      required:
        - message_id
        - status
        - message
      properties:
        message_id:
          type: integer
        status:
          type: string
          enum: [accepted, queued, processing]
        message:
          type: string

    Business:
      type: object
      required:
        - id
        - owner_user_id
        - name
        - data
        - created_at
      properties:
        id:
          type: integer
        owner_user_id:
          type: integer
        name:
          type: string
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    BusinessCreateResponse:
      type: object
      required:
        - business_id
        - message
      properties:
        business_id:
          type: integer
        message:
          type: string

    SuccessResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request payload or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Session or token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict with an existing resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
