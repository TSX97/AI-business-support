openapi: 3.1.0
info:
  title: Core Service API
  version: 0.4.0
  description: |
    MVP contract for the Go Core Service.
    Entity IDs are positive PostgreSQL BIGINT values represented as JSON integers.
    The Core Service stores domain data in PostgreSQL, publishes AI work to NATS JetStream,
    and streams AI response events to clients over SSE.

servers:
  - url: https://localhost
    description: Public API through NGINX
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Check whether the Core Service is running
      description: Liveness endpoint for Docker, orchestration, and monitoring. It does not check PostgreSQL or NATS availability.
      tags: [Operations]
      security: []
      responses:
        '200':
          description: Core Service process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: healthy
              example:
                status: healthy

  /chat:
    post:
      summary: Create a chat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get a chat and a page of its messages
      tags: [Chat]
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: chat_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the previous response.
          schema:
            type: string
      responses:
        '200':
          description: Chat and messages loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Rename a chat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRenameRequest'
      responses:
        '200':
          description: Chat renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a chat and its messages
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatDeleteRequest'
      responses:
        '200':
          description: Chat deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chats:
    get:
      summary: List chats available to the authenticated user
      description: Returns chats owned by the user, ordered by most recently updated first.
      tags: [Chat]
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the previous response.
          schema:
            type: string
      responses:
        '200':
          description: Chats loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/message:
    post:
      summary: Save a user message and queue AI processing
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      responses:
        '202':
          description: Message saved and accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/message/{message_id}/events:
    get:
      summary: Stream the AI response to a chat message using Server-Sent Events
      description: |
        Opens an SSE stream for the AI response associated with message_id.
        Use fetch-based streaming when sending a Bearer token; native EventSource
        cannot set an Authorization header. A new connection starts with the
        current accumulated response and then receives new deltas. Reconnection
        replay after a disconnect is not guaranteed in the MVP.
      tags: [Chat]
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: user_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: |
            SSE stream. Events are UTF-8 text/event-stream records. The stream
            ends after message.completed or message.failed.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: message.status
                data: {"message_id":9002,"status":"processing"}

                event: message.delta
                data: {"message_id":9002,"sequence":1,"delta":"We lost "}

                event: message.completed
                data: {"message_id":9002,"assistant_message_id":9003,"status":"completed"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Stream could not be established; returned before SSE headers are sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /business:
    post:
      summary: Create a business
      tags: [Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessCreateRequest'
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List businesses available to the authenticated user
      description: Returns businesses owned by or shared with the user, ordered by most recently updated first.
      tags: [Business]
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            $ref: '#/components/schemas/ID'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the previous response.
          schema:
            type: string
      responses:
        '200':
          description: Businesses loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update a business
      description: Replaces the editable business fields. The owner is not changed.
      tags: [Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdateRequest'
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a business
      description: Deletes the business and its membership rows. Does not delete chats or messages.
      tags: [Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessDeleteRequest'
      responses:
        '200':
          description: Business deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /business/member:
    post:
      summary: Add a user to a business
      tags: [Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Remove a user from a business
      tags: [Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessMemberDeleteRequest'
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request or field validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid authentication/session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated user is not allowed to perform this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found or not accessible to this user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Duplicate or conflicting state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Unexpected server failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ID:
      type: integer
      format: int64
      minimum: 1
      description: Positive PostgreSQL BIGINT identifier.
      example: 123
    ApiError:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: chat_id must be a positive integer
            details:
              type: object
              additionalProperties: true
    SuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    ChatCreateRequest:
      type: object
      required: [user_id, chat_name]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        chat_name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true
    ChatCreateResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ChatRecord'
    ChatRenameRequest:
      type: object
      required: [user_id, chat_id, new_chat_name]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        chat_id:
          $ref: '#/components/schemas/ID'
        new_chat_name:
          type: string
          minLength: 1
          maxLength: 80
    ChatDeleteRequest:
      type: object
      required: [user_id, chat_id]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        chat_id:
          $ref: '#/components/schemas/ID'
    ChatDetailResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [chat, messages, next_cursor]
          properties:
            chat:
              $ref: '#/components/schemas/ChatRecord'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessageRecord'
            next_cursor:
              type: [string, 'null']
    ChatListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [chats, next_cursor]
          properties:
            chats:
              type: array
              items:
                $ref: '#/components/schemas/ChatListItem'
            next_cursor:
              type: [string, 'null']
    ChatListItem:
      allOf:
        - $ref: '#/components/schemas/ChatRecord'
        - type: object
          required: [last_message_preview, last_message_at]
          properties:
            last_message_preview:
              type: [string, 'null']
              maxLength: 200
            last_message_at:
              type: [string, 'null']
              format: date-time
    ChatMessageRequest:
      type: object
      required: [user_id, chat_id, message_content]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        chat_id:
          $ref: '#/components/schemas/ID'
        message_content:
          type: string
          minLength: 1
          maxLength: 20000
        metadata:
          type: object
          additionalProperties: true
    ChatMessageAcceptedResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [message_id, chat_id, status, accepted_at]
          properties:
            message_id:
              $ref: '#/components/schemas/ID'
            chat_id:
              $ref: '#/components/schemas/ID'
            status:
              type: string
              const: queued
            accepted_at:
              type: string
              format: date-time
    BusinessCreateRequest:
      type: object
      required: [user_id, business_name]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
        business_data:
          type: object
          additionalProperties: true
          default: {}
    BusinessUpdateRequest:
      type: object
      required: [user_id, business_id, business_name, description, business_data]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        business_id:
          $ref: '#/components/schemas/ID'
        business_name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 1000
        business_data:
          type: object
          additionalProperties: true
    BusinessDeleteRequest:
      type: object
      required: [user_id, business_id]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        business_id:
          $ref: '#/components/schemas/ID'
    BusinessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/BusinessRecord'
    BusinessListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [businesses, next_cursor]
          properties:
            businesses:
              type: array
              items:
                $ref: '#/components/schemas/BusinessRecord'
            next_cursor:
              type: [string, 'null']
    BusinessMemberRequest:
      type: object
      required: [user_id, business_id, member_user_id]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        business_id:
          $ref: '#/components/schemas/ID'
        member_user_id:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum: [member, admin]
          default: member
    BusinessMemberDeleteRequest:
      type: object
      required: [user_id, business_id, member_user_id]
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        business_id:
          $ref: '#/components/schemas/ID'
        member_user_id:
          $ref: '#/components/schemas/ID'
    ChatRecord:
      type: object
      required: [chat_id, user_id, chat_name, description, created_at, updated_at]
      properties:
        chat_id:
          $ref: '#/components/schemas/ID'
        user_id:
          $ref: '#/components/schemas/ID'
        chat_name:
          type: string
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatMessageRecord:
      type: object
      required: [message_id, chat_id, user_id, role, content, created_at]
      properties:
        message_id:
          $ref: '#/components/schemas/ID'
        chat_id:
          $ref: '#/components/schemas/ID'
        user_id:
          $ref: '#/components/schemas/ID'
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time
    BusinessRecord:
      type: object
      required: [business_id, user_id, business_name, description, business_data, created_at, updated_at]
      properties:
        business_id:
          $ref: '#/components/schemas/ID'
        user_id:
          $ref: '#/components/schemas/ID'
        business_name:
          type: string
        description:
          type: [string, 'null']
        business_data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
