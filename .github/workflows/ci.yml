name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/ai/requirements.txt
            backend/auth/requirements.txt
            backend/core/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: |
          echo "Enabling pnpm through Corepack."
          corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          echo "Installing frontend dependencies from the lockfile."
          pnpm install --frozen-lockfile

      - name: Validate Python syntax
        run: bash .github/scripts/test-python.sh

      - name: Build frontend
        working-directory: frontend
        run: |
          echo "Running TypeScript validation and building the frontend."
          pnpm build

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find Go modules
        id: modules
        shell: bash
        run: |
          mapfile -t modules < <(find . -name go.mod -not -path './.git/*' -not -path './vendor/*' -print)
          if (( ${#modules[@]} == 0 )); then
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No go.mod found; skipping Go checks."
          else
            echo "has_go=true" >> "$GITHUB_OUTPUT"
            printf 'Found Go modules:\n%s\n' "${modules[@]}"
          fi

      - name: Set up Go
        if: steps.modules.outputs.has_go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Check Go formatting
        if: steps.modules.outputs.has_go == 'true'
        shell: bash
        run: |
          echo "Checking gofmt formatting..."
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.git/*' -not -path './vendor/*'))
          if [[ -n "$unformatted" ]]; then
            echo "These Go files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi
          echo "All Go files are formatted."

      - name: Run Go vet and tests
        if: steps.modules.outputs.has_go == 'true'
        shell: bash
        run: |
          set -o pipefail
          mapfile -t modules < <(find . -name go.mod -not -path './.git/*' -not -path './vendor/*' -print)
          for module_file in "${modules[@]}"; do
            module_dir=$(dirname "$module_file")
            echo "::group::Go checks: $module_dir"
            (
              cd "$module_dir"
              echo "Running go vet ./..."
              go vet ./...
              echo "Running go test -v -race -cover ./..."
              go test -v -race -cover ./...
            )
            echo "::endgroup::"
          done

  build:
    name: Build ${{ matrix.image }}
    needs: [test, go-test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: backend/auth
          - image: core-service
            context: backend/core
          - image: ai-service
            context: backend/ai
          - image: frontend
            context: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          tags: local/ai-business-support-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
